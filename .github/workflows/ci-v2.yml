name: CI v2 (Go server + Tauri client)

# 工作流必须位于仓库根 .github/workflows/，嵌套在 v2/ 下不会被 GitHub 触发。
on:
  push:
    branches: [master]
    paths:
      - 'v2/**'
      - 'desktop/core/**'
      - 'tests/**'
      - 'selfshare/**'
      - '.github/workflows/ci-v2.yml'
  pull_request:
    branches: [master]
    paths:
      - 'v2/**'
      - 'desktop/core/**'
      - 'tests/**'
      - 'selfshare/**'
      - '.github/workflows/ci-v2.yml'
  workflow_dispatch:

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: '1.24'

jobs:
  server-test:
    name: Go test / vet (race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v2/server/go.sum
      - name: Unit + compatibility tests (race)
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  server-build:
    name: Server binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: server-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    defaults:
      run:
        working-directory: v2/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v2/server/go.sum
      - name: Cross-compile
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -trimpath -ldflags="-s -w" \
            -o "bin/selfshare-server-${GOOS}-${GOARCH}${ext}" ./cmd/selfshare-server
          ls -lh bin/
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: v2/server/bin/*
          if-no-files-found: error

  compat:
    name: Python suite against Go server
    needs: server-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v2/server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Go server binary
        working-directory: v2/server
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$RUNNER_TEMP/selfshare-server" ./cmd/selfshare-server
      - name: Sync / conflict / history tests
        env:
          SELFSHARE_SERVER_BIN: ${{ runner.temp }}/selfshare-server
        run: python tests/test_sync.py -v
      - name: P2P registry tests
        env:
          SELFSHARE_SERVER_BIN: ${{ runner.temp }}/selfshare-server
        run: python tests/test_p2p.py -v

  docker:
    name: Docker image + /api/ping smoke
    needs: server-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t selfshare-server:ci ./v2/server
      - name: Run container and probe
        run: |
          docker run -d --rm --name ss-ci -p 8585:8585 selfshare-server:ci \
            --root /data --host 0.0.0.0 --port 8585
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8585/api/ping; then ok=1; break; fi
            sleep 1
          done
          test -n "$ok"
          docker logs ss-ci
      - name: Stop container
        if: always()
        run: docker stop ss-ci || true

  client:
    name: Tauri client build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: v2/client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2/client/src-tauri
      - name: Install frontend dependencies
        working-directory: v2/client
        run: npm ci
      - name: Build Svelte frontend
        working-directory: v2/client
        run: npm run build
      - name: Build Rust + Tauri bundle
        working-directory: v2/client
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: selfshare-client-windows
          path: v2/client/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
