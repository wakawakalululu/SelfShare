# Release 去旧留新：演练发布转 prerelease，稳定版固定为 latest。
#
# 背景：演练发布 v1.1.0（8 资产）发布时间晚于稳定版 v2.0.0，GitHub 的
# 「latest」按发布时间取值，导致 latest 口径漂移。本工作流幂等且可逆
# （只改 release 元数据，不删除任何资产），可重复执行。
#
# 触发：workflow_dispatch；以及本文件变更 push（首次落地即自动执行一次）。

name: Release hygiene

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-hygiene.yml'

permissions:
  contents: write

concurrency:
  group: release-hygiene
  cancel-in-progress: false

jobs:
  mark:
    name: v1.1.0 → prerelease, stable → latest
    runs-on: ubuntu-latest
    steps:
      - name: Flip drill release v1.1.0 to prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.1.0 --prerelease --repo "$GITHUB_REPOSITORY"

      - name: Pin stable v2.1.2 as latest and assert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v2.1.2 尚未发布时跳过（发布前的过渡期），发布后则强制断言。
          if ! gh release view v2.1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.1.2 not published yet; skipping pin (no failure)"
            exit 0
          fi
          gh release edit v2.1.2 --latest --repo "$GITHUB_REPOSITORY"
          # gh release view 的 JSON 字段无 isLatest（runner gh 版本差异），
          # 改用 REST /releases/latest 断言，口径与 get_latest_release 一致。
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          echo "latest=$latest"
          # 期望值随版本推进：v2.1.1 → v2.1.2（Go/Rust robustness 修复随版）
          if [ "$latest" != "v2.1.2" ]; then
            echo "::error::latest release is $latest, expected v2.1.2"
            exit 1
          fi

      - name: Show release overview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY"
