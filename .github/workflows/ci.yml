name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: '1'
  # Windows runner 默认 stdout 非 UTF-8，CLI 的中文提示（selfshare/cli.py:104）会抛
  # UnicodeEncodeError 并让 CLI smoke 失败；固定编码后无需再用 || true 掩盖。
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'

jobs:
  python:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show version
        run: python --version

      - name: Byte-compile (syntax gate)
        run: python -m compileall -q selfshare tests

      - name: Sync tests
        run: python tests/test_sync.py -v

      - name: P2P tests
        run: python tests/test_p2p.py -v

      - name: Pairing tests
        run: python tests/test_pairing.py -v

      - name: CLI smoke
        shell: bash
        run: |
          python selfshare.py --version
          python selfshare.py vault list --root "$RUNNER_TEMP/ss-ci"

  rust:
    name: Rust core tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # 集成测试会拉起 Python 服务端，必须先装好解释器
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/core

      - name: Build
        working-directory: desktop/core
        run: cargo build --release

      - name: Test
        working-directory: desktop/core
        shell: bash
        run: |
          set -o pipefail
          cargo test --release -- --nocapture 2>&1 | tee /tmp/rust-test.log

      - name: Integration tests against Python server
        working-directory: desktop/core
        run: cargo test --release --test integration -- --test-threads=1

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          # 诊断步骤尽力收集信息；主测试步骤已用 pipefail 严格失败。
          set +e
          echo "=== python ==="
          command -v python3
          command -v python
          python3 --version || python --version
          echo "=== temp dir ==="; echo "$TMPDIR"; ls -ld /tmp
          echo "=== last 80 lines of test log ==="
          tail -80 /tmp/rust-test.log
          echo "=== rerun verbose ==="
          cd desktop/core
          cargo test --release --test integration -- --test-threads=1 --nocapture 2>&1 | tail -60

      - name: Upload core artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: selfshare-core-windows
          path: desktop/core/target/release/selfshare_core.dll
          if-no-files-found: error

  gui:
    name: Windows GUI build
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/core

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor -v

      - name: Build Rust core
        working-directory: desktop/core
        run: cargo build --release

      - name: Flutter pub get
        working-directory: desktop/app
        run: flutter pub get

      - name: Analyze
        working-directory: desktop/app
        run: flutter analyze

      - name: Build Windows release
        working-directory: desktop/app
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== build.log tail ==="
            Get-Content build.log -Tail 120 | ForEach-Object { Write-Host "::error::$_" }
            throw "flutter build windows failed"
          }

      - name: Bundle Rust DLL and verify
        shell: pwsh
        working-directory: desktop/app
        run: |
          $bundle = "build\windows\x64\runner\Release"
          Copy-Item "..\core\target\release\selfshare_core.dll" $bundle -Force
          $required = @('selfshare_desktop.exe','flutter_windows.dll','data\app.so','selfshare_core.dll')
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $bundle $_)) }
          if ($missing) { throw "bundle incomplete: $($missing -join ', ')" }
          Get-ChildItem $bundle | Select-Object Name, Length

      - name: Smoke test (process stays alive with a window)
        shell: pwsh
        working-directory: desktop/app
        run: |
          $bundle = "build\windows\x64\runner\Release"
          $p = Start-Process -FilePath "$bundle\selfshare_desktop.exe" -WorkingDirectory $bundle -PassThru
          Start-Sleep -Seconds 10
          $proc = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $proc) { throw "GUI exited early" }
          Write-Host "alive: mem=$([math]::Round($proc.WorkingSet64/1MB,1))MB threads=$($proc.Threads.Count)"
          if ($proc.MainWindowHandle -eq 0) { throw "no window created" }
          Write-Host "window title: $($proc.MainWindowTitle)"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: selfshare-desktop-windows-x64
          path: desktop/app/build/windows/x64/runner/Release/**
          if-no-files-found: error

  # ---- v2 收敛架构（Go 服务端 + Tauri 客户端）：远程流水线做完整编译检查 ----

  v2-server:
    name: v2 Go server (vet/test/docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: v2/server/go.sum

      - name: Vet
        working-directory: v2/server
        run: go vet ./...

      - name: Test
        working-directory: v2/server
        run: go test -race ./...

      - name: Cross-compile smoke (linux/windows)
        working-directory: v2/server
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux   GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/selfshare-server
          GOOS=windows GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/selfshare-server

      - name: Docker image build
        working-directory: v2/server
        run: docker build -t selfshare-server:ci .

      - name: Docker smoke (serve + ping)
        working-directory: v2/server
        run: |
          docker run -d --rm --name ss-ci -p 8585:8585 selfshare-server:ci \
            --root /data --host 0.0.0.0 --port 8585
          ok=""
          for i in $(seq 1 15); do
            if wget -qO- http://127.0.0.1:8585/api/ping | grep -q '"ok":true'; then ok=1; break; fi
            sleep 1
          done
          docker stop ss-ci
          test -n "$ok" || { echo "::error::server did not answer /api/ping"; exit 1; }

  v2-client:
    name: v2 Tauri client (compile check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/core
            v2/client/src-tauri

      # frontendDist("../dist") 在 .gitignore 里，必须先构建前端，Tauri 代码生成才能通过
      - name: Build frontend (vite)
        working-directory: v2/client
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Cargo check (server kernel + tauri client)
        working-directory: v2/client/src-tauri
        run: cargo check --all-targets
