name: CI v2 (Go server + Tauri client)

# 工作流必须位于仓库根 .github/workflows/，嵌套在 v2/ 下不会被 GitHub 触发。
on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'v2/**'
      - 'desktop/core/**'
      - 'tests/**'
      - 'selfshare/**'
      - '.github/workflows/ci-v2.yml'
  pull_request:
    branches: [master]
    paths:
      - 'v2/**'
      - 'desktop/core/**'
      - 'tests/**'
      - 'selfshare/**'
      - '.github/workflows/ci-v2.yml'
  workflow_dispatch:

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: '1.24'

jobs:
  server-test:
    name: Go test / vet (race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v2/server/go.sum
      - name: Unit + compatibility tests (race)
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  server-build:
    name: Server binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: server-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    defaults:
      run:
        working-directory: v2/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v2/server/go.sum
      - name: Cross-compile
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -trimpath -ldflags="-s -w" \
            -o "bin/selfshare-server-${GOOS}-${GOARCH}${ext}" ./cmd/selfshare-server
          ls -lh bin/
      # 交叉编译只能保证"能构建"，这里让 linux/amd64 产物实跑一次。
      - name: Smoke test linux/amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          B=bin/selfshare-server-linux-amd64
          go version -m "$B"
          "$B" --version | grep -q '^selfshare-server '
          "$B" --root "$RUNNER_TEMP/ss-smoke" --host 127.0.0.1 --port 18584 --quiet \
            > "$RUNNER_TEMP/ss-smoke.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ss-smoke.pid"
          ok=""
          for i in $(seq 1 20); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/ss-smoke.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/ss-smoke.log"; exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:18584/api/ping | grep -q '"engine":"go"'; then ok=1; break; fi
            sleep 0.5
          done
          test -n "$ok"
      - name: Stop smoke server
        if: always() && matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          # 仅清理后台进程与日志，不影响上一步的失败结论。
          if [ -f "$RUNNER_TEMP/ss-smoke.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/ss-smoke.pid")
            kill "$pid" 2>/dev/null || true
            for i in 1 2 3 4 5; do kill -0 "$pid" 2>/dev/null || break; sleep 0.2; done
          fi
          cat "$RUNNER_TEMP/ss-smoke.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: v2/server/bin/*
          if-no-files-found: error

  compat:
    name: Python suite against Go server
    needs: server-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v2/server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Go server binary
        working-directory: v2/server
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$RUNNER_TEMP/selfshare-server" ./cmd/selfshare-server
      - name: Sync / conflict / history tests
        env:
          SELFSHARE_SERVER_BIN: ${{ runner.temp }}/selfshare-server
        run: python tests/test_sync.py -v
      - name: P2P registry tests
        env:
          SELFSHARE_SERVER_BIN: ${{ runner.temp }}/selfshare-server
        run: python tests/test_p2p.py -v

      # AGENTS.md §6 缺口：HTTPS 自签 + /api/pair 冒烟此前无 CI 覆盖。
      # 复用本 job "Build Go server binary" 产出的 $RUNNER_TEMP/selfshare-server，不重复编译。
      - name: HTTPS self-signed + GET /api/pair smoke
        shell: bash
        env:
          SELFSHARE_SERVER_BIN: ${{ runner.temp }}/selfshare-server
        run: |
          set -euo pipefail
          BIN="$SELFSHARE_SERVER_BIN"
          if [ ! -x "$BIN" ]; then
            echo "::error::reusable Go server binary missing: $BIN"
            exit 1
          fi

          SS_TMP=""
          SS_PID=""
          cleanup() {
            status=$?
            set +e
            if [ -n "$SS_PID" ]; then
              kill "$SS_PID" 2>/dev/null
              wait "$SS_PID" 2>/dev/null
            fi
            if [ -n "$SS_TMP" ]; then
              rm -rf "$SS_TMP"
            fi
            exit "$status"
          }
          trap cleanup EXIT

          SS_TMP="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ss-https.XXXXXX")"
          : > "$SS_TMP/probe.log"
          # -nodes 生成无口令私钥；curl -k 跳过自签证书校验，无需 CA / SAN。
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$SS_TMP/key.pem" -out "$SS_TMP/cert.pem" \
            -days 1 -subj "/CN=localhost"

          # --cert 非空即走 ServeTLS；--quiet 避免启动配对码写进 CI 日志。
          "$BIN" --root "$SS_TMP/data" --host 127.0.0.1 --port 18585 \
            --cert "$SS_TMP/cert.pem" --key "$SS_TMP/key.pem" --quiet \
            > "$SS_TMP/server.log" 2>&1 &
          SS_PID=$!

          BASE="https://127.0.0.1:18585"
          ready=""
          for i in $(seq 1 30); do
            if ! kill -0 "$SS_PID" 2>/dev/null; then
              echo "::error::HTTPS server exited before becoming ready"
              echo "--- server.log ---"; cat "$SS_TMP/server.log"
              echo "--- probe.log ---"; cat "$SS_TMP/probe.log"
              exit 1
            fi
            if curl -kfsS --max-time 2 "$BASE/api/ping" -o "$SS_TMP/ping.json" 2>>"$SS_TMP/probe.log" \
               && curl -kfsS --max-time 2 "$BASE/api/pair" -o "$SS_TMP/pair.json" 2>>"$SS_TMP/probe.log"; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ -z "$ready" ]; then
            echo "::error::HTTPS /api/ping + /api/pair never became ready"
            echo "--- server.log ---"; cat "$SS_TMP/server.log"
            echo "--- probe.log ---"; cat "$SS_TMP/probe.log"
            exit 1
          fi

          # Go 常量 ServiceVersion = "1.0"（internal/api/api.go），HTTP 字段名是 "version"。
          grep -q '"engine":"go"' "$SS_TMP/ping.json" || {
            echo "::error::/api/ping lacks engine=go"; cat "$SS_TMP/ping.json"; exit 1; }
          grep -q '"version":"1.0"' "$SS_TMP/ping.json" || {
            echo "::error::/api/ping lacks version 1.0"; cat "$SS_TMP/ping.json"; exit 1; }
          # GET /api/pair 只回显服务信息（无副作用、不消耗配对码）；POST 才换令牌。
          grep -q '"version":"1.0"' "$SS_TMP/pair.json" || {
            echo "::error::/api/pair lacks version 1.0"; cat "$SS_TMP/pair.json"; exit 1; }
          grep -q '"pairing":true' "$SS_TMP/pair.json" || {
            echo "::error::/api/pair lacks pairing=true"; cat "$SS_TMP/pair.json"; exit 1; }

          echo "HTTPS self-signed + GET /api/pair smoke passed (version 1.0 over TLS)"

  docker:
    name: Docker image + /api/ping smoke
    needs: server-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t selfshare-server:ci ./v2/server
      - name: Run container and probe
        run: |
          docker run -d --rm --name ss-ci -p 8585:8585 selfshare-server:ci \
            --root /data --host 0.0.0.0 --port 8585
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8585/api/ping; then ok=1; break; fi
            sleep 1
          done
          test -n "$ok"
          docker logs ss-ci
      - name: Stop container
        if: always()
        run: docker stop ss-ci || true

  client:
    name: Tauri client build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: v2/client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2/client/src-tauri
      - name: Install frontend dependencies
        working-directory: v2/client
        run: npm ci
      - name: Build Svelte frontend
        working-directory: v2/client
        run: npm run build
      - name: Build Rust + Tauri bundle
        working-directory: v2/client
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: selfshare-client-windows
          path: v2/client/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
