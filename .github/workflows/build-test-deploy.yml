# SelfShare 发布流水线：构建 -> 测试 -> 部署。
#
# 仓库是多子项目 C/S 系统，已有工作流分工如下：
#   - ci.yml / ci-v2.yml：PR 门禁与全平台矩阵（Python / Rust core / Flutter / Tauri / Go 二进制）；
#   - pages.yml：docs/ Jekyll 文档站 -> GitHub Pages；
#   - release.yml：v* 标签 -> GitHub Release（Windows 便携包 + 5 平台二进制）。
# 本工作流补齐缺失的服务端持续部署：主干/标签上构建可部署产物（Docker 镜像），
# 通过回归门禁后推送 ghcr.io，并可选自动滚动部署到自托管服务器。
# 桌面端全平台构建不在这里重复，仍由上面两个 CI 工作流负责。
#
# 推送 ghcr.io 使用内置 GITHUB_TOKEN + packages: write，无需额外 secret。
#
# 可选「自动部署到自有服务器」：在 Settings -> Secrets and variables -> Actions 配置
#   Variables（仓库级）:
#     DEPLOY_HOST          设置后才会启用远程部署；删除该变量即可停用
#     DEPLOY_USER          SSH 用户名（需可免 sudo 执行 docker）
#     DEPLOY_PORT          SSH 端口，默认 22
#     DEPLOY_PATH          远程部署目录，默认 /opt/selfshare
#     DEPLOY_HTTP_PORT     宿主 HTTP 端口，默认 8484
#     DEPLOY_GHCR_USER     拉取私有镜像时的账号，默认 github.actor
#   Secrets:
#     DEPLOY_SSH_KEY       SSH 私钥
#     DEPLOY_GHCR_TOKEN    仅当 GHCR 包为私有时需要（具备 read:packages 的 PAT）；公开镜像可留空
#   远程主机需安装 Docker + Compose 插件 + curl。数据卷固定为 selfshare-data，
#   与 README 的 `docker run -v selfshare-data:/data` 保持同名以复用已有数据。
#   建议给 production 环境配置审批规则，避免每次 push 直接上线。

name: Build, Test & Deploy

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'v2/**'
      - 'desktop/core/**'
      - 'selfshare/**'
      - 'selfshare.py'
      - 'tests/**'
      - 'deploy/**'
      - 'pyproject.toml'
      - '.github/workflows/build-test-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  test-server:
    name: Test Go server (race + vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v2/server/go.sum
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  test-python:
    name: Test Python suite (in-process + Go server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v2/server/go.sum
      - name: Build Go server binary
        working-directory: v2/server
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$RUNNER_TEMP/selfshare-server" ./cmd/selfshare-server
      - name: Byte-compile + Python server regression
        run: |
          python -m compileall -q selfshare tests
          python tests/test_sync.py -v
          python tests/test_p2p.py -v
          python tests/test_pairing.py -v
      # 同一套用例跑在真实 Go 进程上，验证 HTTP 协议与磁盘 registry 的兼容性。
      - name: Protocol compatibility against Go server
        env:
          SELFSHARE_SERVER_BIN: ${{ runner.temp }}/selfshare-server
        run: |
          python tests/test_sync.py -v
          python tests/test_p2p.py -v

  build-frontend:
    name: Build Svelte frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: v2/client/package-lock.json
      - name: Install dependencies
        working-directory: v2/client
        run: npm ci
      - name: Vite build
        working-directory: v2/client
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist-${{ github.sha }}
          path: v2/client/dist
          if-no-files-found: error
          retention-days: 7

  verify-client-dist:
    name: Verify downloaded frontend artifact
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-dist-${{ github.sha }}
          path: client-dist
      - name: Assert client-dist artifact is present and non-empty
        shell: bash
        run: |
          set -euo pipefail
          echo "--- downloaded client-dist ---"
          find client-dist -type f -printf '%p %s bytes\n' | sort
          mapfile -t files < <(find client-dist -type f | sort)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::client-dist artifact contains no files"; exit 1; }
          for f in "${files[@]}"; do
            [ -s "$f" ] || { echo "::error::empty file in client-dist: $f"; exit 1; }
          done
          mapfile -t index_files < <(find client-dist -type f -name 'index.html' -size +0c)
          [ "${#index_files[@]}" -gt 0 ] || { echo "::error::non-empty index.html missing from client-dist"; exit 1; }
          echo "client-dist OK: ${#files[@]} non-empty files"

  image:
    name: Build + smoke-test Docker image
    runs-on: ubuntu-latest
    needs: [test-server, test-python, build-frontend]
    outputs:
      name: ${{ steps.vars.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase GHCR name
        id: vars
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image (loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: ./v2/server
          platforms: linux/amd64
          load: true
          tags: selfshare-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and probe /api/ping
        run: |
          set -euo pipefail
          docker run -d --rm --name ss-cd-smoke -p 18585:8484 selfshare-server:ci
          ok=""
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:18585/api/ping | grep -q '"engine":"go"'; then
              ok=1
              break
            fi
            sleep 1
          done
          docker logs ss-cd-smoke
          test -n "$ok"
      - name: Remove container
        if: always()
        run: docker rm -f ss-cd-smoke || true

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      # 运行阶段的 apk/adduser 需在目标架构执行；builder 阶段用交叉编译，不模拟 Go 工具链。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ needs.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: ./v2/server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      # 部署固定使用不可变的 sha 标签，避免 latest 漂移导致回滚困难。
      - name: Compute immutable image ref
        id: ref
        run: echo "image_ref=${{ needs.image.outputs.name }}:sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to self-hosted server
    runs-on: ubuntu-latest
    needs: publish
    # 只在主干 / 版本标签上线；手动在其它分支触发时仅发布镜像，不动线上服务。
    if: ${{ vars.DEPLOY_HOST != '' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    environment:
      name: production
    steps:
      - name: Validate deployment settings
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_USER" || { echo "::error::DEPLOY_USER variable is not set"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::DEPLOY_SSH_KEY secret is not set"; exit 1; }
      - name: Roll out image over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/selfshare' }}
          DEPLOY_HTTP_PORT: ${{ vars.DEPLOY_HTTP_PORT || '8484' }}
          GHCR_USER: ${{ vars.DEPLOY_GHCR_USER || github.actor }}
          GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_REF,DEPLOY_PATH,DEPLOY_HTTP_PORT,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH"
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            cat > "$DEPLOY_PATH/docker-compose.yml" <<EOF
            services:
              selfshare-server:
                image: $IMAGE_REF
                container_name: selfshare-server
                ports:
                  - "$DEPLOY_HTTP_PORT:8484"
                volumes:
                  - selfshare-data:/data
                command: ["--root", "/data", "--host", "0.0.0.0", "--port", "8484"]
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8484/api/ping"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 10s
            volumes:
              selfshare-data:
                name: selfshare-data
                driver: local
            EOF
            cd "$DEPLOY_PATH"
            docker compose pull
            docker compose up -d --remove-orphans
            ok=""
            for i in $(seq 1 30); do
              if curl -fsS --max-time 2 "http://127.0.0.1:$DEPLOY_HTTP_PORT/api/ping" | grep -q '"engine":"go"'; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "health check failed"
              docker compose logs --tail=100
              exit 1
            fi
            docker compose ps
            docker image prune -f || true
