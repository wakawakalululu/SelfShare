name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v2.0.0'
        required: true

permissions:
  contents: read

jobs:
  windows-bundle:
    name: Build Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/core

      # 复用仓库脚本：自动探测 MSVC/SDK、构建 Rust、分析并打包
      - name: Build everything (Rust core + Flutter GUI)
        shell: pwsh
        run: ./desktop/scripts/build_windows.ps1 -Configuration Release

      - name: Show build log on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "--- flutter doctor ---"
          flutter doctor -v
          Write-Host "--- bundle ---"
          Get-ChildItem "desktop/app/build/windows/x64/runner/Release" -ErrorAction SilentlyContinue

      - name: Assemble portable package
        shell: pwsh
        run: |
          $bundle = "desktop\app\build\windows\x64\runner\Release"
          Copy-Item "desktop\core\target\release\selfshare_core.dll" $bundle -Force

          # 便携包：解压即用
          $stage = "stage\SelfShare"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$bundle\*" $stage -Recurse -Force
          Copy-Item README.md, CHANGELOG.md, LICENSE $stage -Force
          New-Item -ItemType Directory -Force -Path "$stage\server" | Out-Null
          Copy-Item selfshare.py "$stage\server\" -Force
          Copy-Item selfshare "$stage\server\selfshare" -Recurse -Force
          Get-ChildItem "$stage\server\selfshare" -Recurse -Include *.pyc | Remove-Item -Force -ErrorAction SilentlyContinue
          Copy-Item deploy "$stage\deploy" -Recurse -Force

          $ver = "${{ github.event.inputs.tag || github.ref_name }}" -replace '^v',''
          if (-not $ver) { $ver = "dev" }
          Compress-Archive -Path "stage\SelfShare" -DestinationPath "SelfShare-$ver-windows-x64.zip" -Force
          Get-Item "SelfShare-$ver-windows-x64.zip" | Select-Object Name, Length

      - name: Build server bundle (source-only)
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.tag || github.ref_name }}" -replace '^v',''
          if (-not $ver) { $ver = "dev" }
          $stage = "stage2\selfshare-server-$ver"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item selfshare.py, README.md, CHANGELOG.md, LICENSE, pyproject.toml $stage -Force
          Copy-Item selfshare "$stage\selfshare" -Recurse -Force
          Copy-Item deploy "$stage\deploy" -Recurse -Force
          Get-ChildItem $stage -Recurse -Include *.pyc | Remove-Item -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath "selfshare-server-$ver.zip" -Force
          Get-Item "selfshare-server-$ver.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            SelfShare-*-windows-x64.zip
            selfshare-server-*.zip
          if-no-files-found: error

  v2-server-assets:
    name: v2 Go server binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: v2/server/go.sum
      - name: Cross-compile server binaries
        working-directory: v2/server
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "bin/selfshare-server-${os}-${arch}${ext}" ./cmd/selfshare-server
          done
          ls -lh bin/
      - uses: actions/upload-artifact@v4
        with:
          name: v2-server-assets
          path: v2/server/bin/selfshare-server-*
          if-no-files-found: error

  v2-client-bundle:
    name: v2 Tauri client (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/core
            v2/client/src-tauri

      - name: Build Tauri bundle (frontend + installer)
        working-directory: v2/client
        shell: pwsh
        run: |
          npm ci --no-fund --no-audit
          npm run tauri build
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Collect artifacts
        shell: pwsh
        run: |
          $nsis = "v2\client\src-tauri\target\release\bundle\nsis"
          if (Test-Path $nsis) { Get-ChildItem $nsis -Filter *.exe | Select-Object Name, Length }
          if (-not (Get-ChildItem $nsis -Filter *.exe -ErrorAction SilentlyContinue)) {
            throw "no NSIS installer produced"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: v2-client-bundle
          path: v2/client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows-bundle, v2-server-assets, v2-client-bundle]
    runs-on: ubuntu-latest
    # 只有发布 job 需要写权限，构建 job 保持 contents: read。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: v2-server-assets
          path: dist/v2

      - uses: actions/download-artifact@v4
        with:
          name: v2-client-bundle
          path: dist/v2

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # workflow_dispatch 时 GITHUB_REF_NAME 是分支名，必须优先用输入
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 取 CHANGELOG 中该版本小节。只认一级标题（"# [vX.Y.Z]" 或 "# vX.Y.Z"），
          # 未命中直接失败：把整份 CHANGELOG 当 notes 发布属于事故，不做兜底。
          awk -v t="${TAG#v}" '
            !f && /^# / && (index($0, "[" t "]") || index($0, "v" t)) {f=1; next}
            f && /^# / {exit}
            f {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '# [${TAG}]' section; fix the heading before tagging"
            exit 1
          fi
          echo "--- notes ---"; cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          # 明确指定 tag：workflow_dispatch 时 github.ref_name 是分支名
          tag_name: ${{ steps.notes.outputs.tag }}
          name: SelfShare ${{ steps.notes.outputs.tag }}
          body_path: notes.md
          # 8 个资产，glob 互斥避免同一文件被两条模式重复命中：
          # 2 便携包/服务端包 zip + 5 平台服务端二进制 + 1 个 NSIS 安装包
          #（Tauri 产物名为 productName_version_arch-setup.exe）。
          files: |
            dist/*.zip
            dist/v2/selfshare-server-*
            dist/v2/SelfShare_*.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
