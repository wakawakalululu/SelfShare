name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Report Pages config
        run: |
          echo "repo=$GITHUB_REPOSITORY ref=$GITHUB_REF"
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      # upload-pages-artifact 已成功 finalize，但 artifact 元数据 API 偶发短暂不可见，
      # deploy-pages 会立刻报 "Found 0 artifact(s)"。显式轮询到可见再部署。
      - name: Wait for pages artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            found=$(
              curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for a in d.get("artifacts", []) if a.get("name") == "github-pages" and not a.get("expired")))' \
                2>/dev/null || echo 0
            )
            if [ "$found" -ge 1 ]; then
              echo "github-pages artifact visible (attempt $i)"
              exit 0
            fi
            echo "artifact metadata not visible yet (attempt $i)"
            sleep 2
          done
          echo "::error::github-pages artifact never became visible"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 10000
